name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q AronArikAIStudio-PhoneBuild-NewIcon.zip -d project
          SETTINGS_FILE="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android project settings file not found"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          if [ ! -f "$APP_GRADLE" ]; then
            APP_GRADLE="$(find "$PROJECT_DIR" -path '*/app/build.gradle.kts' -type f | head -n 1)"
          fi
          if [ -z "$APP_GRADLE" ] || [ ! -f "$APP_GRADLE" ]; then
            echo "App build.gradle.kts not found"
            exit 1
          fi
          cat >> "$APP_GRADLE" <<'EOF'

          // Build compatibility fix: align Java and Kotlin bytecode targets.
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          echo "Applied Java/Kotlin JVM target compatibility fix to $APP_GRADLE"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          SETTINGS_FILE="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android project settings file not found"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aron-Arik-AI-Studio-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
