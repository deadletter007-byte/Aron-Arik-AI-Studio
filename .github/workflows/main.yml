
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect repository files
        run: |
          echo "Repository files:"
          ls -lah
          echo "ZIP files:"
          find . -type f -iname "*.zip"
