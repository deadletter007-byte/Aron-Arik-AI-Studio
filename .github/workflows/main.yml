name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f
          unzip -l "./AronArikAIStudio-PhoneBuild-v2.zip"
